[project]
name = "skillbridge-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tanishka Shirode", email = "tmusicholic13@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.8",
    "langchain-openai>=1.7.3",
    "langgraph>=1.2.19",
    "mcp>=2.3.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
skillbridge-ai = "skillbridge_ai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
